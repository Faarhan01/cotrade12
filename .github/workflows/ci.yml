name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: cd backend && ruff check .
      - name: Test
        run: cd backend && PYTHONPATH=. pytest -q tools/simulatedtester/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: for f in frontend/assets/js/lib/*.js frontend/assets/js/pages/*.js; do node --check "$f"; done
