[project]
name = "cotrade-backend"
version = "1.0.0"
description = "Cotrade backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tools/simulatedtester/tests"]
addopts = "-q"
cache_dir = "tools/simulatedtester/.pytest_cache"

[tool.ruff]
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "py311"